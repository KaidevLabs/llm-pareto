<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Pareto — quality vs price</title>
<meta name="description" content="LMArena frontier models ranked by quality (Elo) against OpenRouter pricing, with the Pareto frontier highlighted.">
<style>
  /* Global page CSS. Everything else (panels, drawer, of-panel) moves to its
     component as the port advances (028 steps 2-4); public/index.html stays
     the live site until the cutover step. */
  /* Inter self-hosted (plan 019, D1'). Provenance: variable font (wght 100-900),
     latin subset, fetched 2026-09-17 from
     https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap
     -> https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2
     sha256 3100e775e8616cd2611beecfa23a4263d7037586789b43f035236a2e6fbd4c62 (48,256 B).
     One file serves weights 400-700; latin-ext only if tofu ever appears. */
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("./fonts/inter-var.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  :root {
    --bg: #06080d;
    --panel: rgba(148, 163, 184, 0.05);
    --border: rgba(148, 163, 184, 0.14);
    --text: #e2e8f0;
    --muted: #8b98ab;
    --accent: #34d399;
    --accent-dim: rgba(52, 211, 153, 0.14);
    --gold: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1100px 700px at 78% -10%, rgba(52, 211, 153, 0.07), transparent 60%),
      radial-gradient(900px 600px at 5% 115%, rgba(129, 140, 248, 0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  /* the old body flex column: the app root is the flex container now */
  #app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
</style>
</head>
<body>
<div id="app"></div>
<!-- echarts 5.6.0 (vendored, plan 019 byte-pin audit) loads as a classic
     script BEFORE the module bundle — window.echarts must exist when any
     chart code runs. echarts-gl stays lazy (injected on 3D entry, 023 D5). -->
<script src="./js/echarts-5.6.0.min.js"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
